<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Inventory Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-600 text-white p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <span class="font-bold text-lg">Asset Inventory Management</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Registration Form Card -->
        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Register New Asset</h2>
            <form id="assetForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">ECN *</label>
                        <input type="text" id="ecn" required placeholder="ECN-8842" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Serial Number *</label>
                        <input type="text" id="serialNumber" required placeholder="SN-991823" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Room Number</label>
                        <input type="text" id="roomNumber" placeholder="204B" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Item Name *</label>
                        <input type="text" id="itemName" required placeholder="Microscope" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Manufacturer</label>
                        <input type="text" id="manufacturer" placeholder="Zeiss" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Website</label>
                        <input type="text" id="website" placeholder="Any link or text..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Booklet / Link</label>
                        <input type="text" id="bookletUrl" placeholder="Any link or text..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Photo Upload (Local File)</label>
                        <input type="file" id="photoFile" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                        <input type="hidden" id="photoData">
                    </div>
                </div>
                <div class="pt-2 flex justify-end">
                    <button type="submit" id="submitBtn" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold transition shadow-md">Commit Asset Record</button>
                </div>
            </form>
        </div>

        <!-- Inventory Equipment List & Management Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-900">Active Inventory Register</h3>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search records..." class="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-xl text-xs w-64 outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
                            <th class="py-3 px-4">Photo</th>
                            <th class="py-3 px-4">ECN</th>
                            <th class="py-3 px-4">Item Name</th>
                            <th class="py-3 px-4">Serial Number</th>
                            <th class="py-3 px-4">Room</th>
                            <th class="py-3 px-4">Manufacturer</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Populated via script -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL_HERE";
        let inventory = JSON.parse(localStorage.getItem('ims_local_inventory') || '[]');

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    document.getElementById('photoData').value = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "Transmitting...";

            const payload = {
                ecn: document.getElementById('ecn').value.trim(),
                serialNumber: document.getElementById('serialNumber').value.trim(),
                roomNumber: document.getElementById('roomNumber').value.trim(),
                itemName: document.getElementById('itemName').value.trim(),
                manufacturer: document.getElementById('manufacturer').value.trim(),
                website: document.getElementById('website').value.trim(),
                bookletUrl: document.getElementById('bookletUrl').value.trim(),
                photoData: document.getElementById('photoData').value.trim()
            };

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                inventory.unshift(payload);
                localStorage.setItem('ims_local_inventory', JSON.stringify(inventory));
                renderTable();
                document.getElementById('assetForm').reset();
                document.getElementById('photoData').value = "";
                alert("Asset successfully saved!");
            } catch (err) {
                alert("Transmission failed.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Commit Asset Record";
            }
        }

        async function deleteAsset(ecn) {
            if (!confirm(`Are you sure you want to delete ECN: ${ecn}?`)) return;

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "delete", ecn: ecn })
                });

                inventory = inventory.filter(item => item.ecn !== ecn);
                localStorage.setItem('ims_local_inventory', JSON.stringify(inventory));
                renderTable();
            } catch (err) {
                alert("Failed to delete record.");
            }
        }

        function renderTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('tableBody');
            
            const filtered = inventory.filter(i => 
                i.ecn.toLowerCase().includes(query) || 
                i.itemName.toLowerCase().includes(query) || 
                i.roomNumber.toLowerCase().includes(query) ||
                i.manufacturer.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400 text-xs">No equipment records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-3 px-4">
                        <div class="w-10 h-10 rounded-lg bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center">
                            ${item.photoData ? `<img src="\${item.photoData}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-image text-slate-300 text-xs"></i>'}
                        </div>
                    </td>
                    <td class="py-3 px-4 font-mono font-bold text-xs">${escapeHtml(item.ecn)}</td>
                    <td class="py-3 px-4 font-semibold text-slate-800 text-sm">${escapeHtml(item.itemName)}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${escapeHtml(item.serialNumber)}</td>
                    <td class="py-3 px-4 text-xs">${escapeHtml(item.roomNumber || '-')}</td>
                    <td class="py-3 px-4 text-xs text-slate-600">${escapeHtml(item.manufacturer || '-')}</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteAsset('${item.ecn}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition" title="Delete Asset"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }

        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
